nameOverride: ""

serviceMesh:
  # Empty: OLM follows the operator's default channel (OCP 4.22 branch).
  channel: ""
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace

kiali:
  channel: stable
  installPlanApproval: Automatic
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace

istio:
  namespace: istio-system
  # Istio version for Istio, IstioCNI and ZTunnel (for example v1.28.10). Empty: the
  # operator's default at creation time. It must be one the installed operator supports.
  version: ""
  discoverySelector:
    matchLabels:
      istio.io/dataplane-mode: ambient

istioCni:
  namespace: istio-cni

ztunnel:
  namespace: ztunnel
