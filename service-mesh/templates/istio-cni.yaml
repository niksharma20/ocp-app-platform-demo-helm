---
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  namespace: {{ .Values.istioCni.namespace }}
  {{- with .Values.istio.version }}
  version: {{ . }}
  {{- end }}
  profile: ambient
  values:
    cni:
      # Persists CNI config across node reboots so pods that start before
      # ZTunnel's initial reconciliation still get iptables rules set up
      # and are properly handed off for HBONE enrollment.
      istioOwnedCNIConfig: true
      ambient:
        # On startup, check and repair the in-pod iptables rules of pods already
        # in the mesh. Off by default upstream; Red Hat asks for it in ambient
        # mode because pods otherwise lose mesh connectivity after a node
        # restart (OSSM-11616).
        reconcileIptablesOnStartup: true
