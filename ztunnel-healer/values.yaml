nameOverride: ""

namespace: istio-mesh-tools

schedule: "*/2 * * * *"

image: registry.redhat.io/openshift4/ose-cli:v4.15.0

minPodAgeSeconds: 60

probeTimeoutSeconds: 3

# Unready pods are only probed once a container has restarted this often (crash loop).
minRestartsWhenUnready: 3

excludeNamespaces:
  - kube-system
  - istio-system
  - istio-cni
  - ztunnel

dryRun: false
