---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cosign-keygen
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "create"]
  # Trusted Artifact Signer 1.4+ publishes its CLI downloads here instead of an
  # in-cluster cli-server.
  - apiGroups: ["console.openshift.io"]
    resources: ["consoleclidownloads"]
    verbs: ["get"]
