---
apiVersion: batch/v1
kind: Job
metadata:
  name: cosign-keygen
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: cosign-keygen
      restartPolicy: OnFailure
      containers:
        - name: cosign-keygen
          image: registry.redhat.io/openshift4/ose-cli:v4.15.0
          env:
            - name: VAULT_NAMESPACE
              value: {{ .Values.vault.namespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Wait for Vault KV engine to be ready (vault-setup job must have
              # finished enabling KV v2 and logging in with the root token)
              echo "Waiting for Vault..."
              until oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv list kv/secrets 2>/dev/null; do
                echo "Vault KV engine not ready, retrying in 10s..."
                sleep 10
              done
              echo "Vault is ready"

              # Check if keys already exist in Vault
              echo "Checking if cosign keys already exist in Vault..."
              EXISTING=$(oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv get -field=value kv/secrets/rhtas/cosign-public-key 2>/dev/null)
              if [ -n "$EXISTING" ]; then
                echo "Cosign keys already exist in Vault, skipping"
                exit 0
              fi

              # Get the cosign that belongs to the installed Trusted Artifact Signer:
              #  - up to 1.3: the in-cluster cli-server in this namespace
              #  - 1.4 and later: no cli-server; the operator publishes the download
              #    (developers.redhat.com) in ConsoleCLIDownload rhtas-cosign
              case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
              get_cosign() {
                rm -rf /tmp/cosign-dl && mkdir -p /tmp/cosign-dl
                if curl -sf "http://cli-server.{{ .Values.namespace }}.svc:8080/clients/linux/cosign-${ARCH}.gz" -o /tmp/cosign-dl/cosign.gz; then
                  echo "cosign from the in-cluster cli-server"
                  gunzip -c /tmp/cosign-dl/cosign.gz > /tmp/cosign
                  return 0
                fi
                URL=$(oc get consoleclidownload rhtas-cosign -o jsonpath='{range .spec.links[*]}{.href}{"\n"}{end}' 2>/dev/null \
                      | grep -i linux | grep -i "$ARCH" | head -1)
                [ -n "$URL" ] || return 1
                curl -sfL "$URL" -o /tmp/cosign-dl/download || return 1
                echo "cosign from $URL"
                case "$URL" in
                  *.tar.gz|*.tgz)
                    tar -xzf /tmp/cosign-dl/download -C /tmp/cosign-dl || return 1
                    BIN=$(find /tmp/cosign-dl -type f -name 'cosign*' ! -name download | head -1)
                    [ -n "$BIN" ] && mv "$BIN" /tmp/cosign ;;
                  *.gz) gunzip -c /tmp/cosign-dl/download > /tmp/cosign ;;
                  *) mv /tmp/cosign-dl/download /tmp/cosign ;;
                esac
              }
              until get_cosign && [ -s /tmp/cosign ]; do
                echo "No cosign download yet (cli-server or ConsoleCLIDownload rhtas-cosign), retrying in 20s..."
                sleep 20
              done
              chmod +x /tmp/cosign
              /tmp/cosign version 2>/dev/null | grep -i gitversion || true

              # Generate key pair
              echo "Generating cosign key pair..."
              cd /tmp
              COSIGN_PASSWORD="" /tmp/cosign generate-key-pair

              PRIVATE_KEY=$(cat /tmp/cosign.key)
              PUBLIC_KEY=$(cat /tmp/cosign.pub)

              if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
                echo "ERROR: Failed to generate cosign key pair"
                exit 1
              fi

              # Store keys in Vault
              echo "Storing cosign keys in Vault..."
              oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv put kv/secrets/rhtas/cosign-private-key value="$PRIVATE_KEY"
              oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv put kv/secrets/rhtas/cosign-public-key value="$PUBLIC_KEY"

              echo "Cosign keys generated and stored in Vault successfully"
