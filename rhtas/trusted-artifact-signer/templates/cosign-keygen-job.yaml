---
apiVersion: batch/v1
kind: Job
metadata:
  name: cosign-keygen
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: cosign-keygen
      restartPolicy: OnFailure
      containers:
        - name: cosign-keygen
          image: registry.redhat.io/openshift4/ose-cli:v4.15.0
          env:
            - name: VAULT_NAMESPACE
              value: {{ .Values.vault.namespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Wait for Vault KV engine to be ready (vault-setup job must have
              # finished enabling KV v2 and logging in with the root token)
              echo "Waiting for Vault..."
              until oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv list kv/secrets 2>/dev/null; do
                echo "Vault KV engine not ready, retrying in 10s..."
                sleep 10
              done
              echo "Vault is ready"

              # Check if keys already exist in Vault
              echo "Checking if cosign keys already exist in Vault..."
              EXISTING=$(oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv get -field=value kv/secrets/rhtas/cosign-public-key 2>/dev/null)
              if [ -n "$EXISTING" ]; then
                echo "Cosign keys already exist in Vault, skipping"
                exit 0
              fi

              # Get a cosign binary, in this order:
              #  1. the in-cluster cli-server of Trusted Artifact Signer up to 1.3
              #  2. the download the installed operator publishes in ConsoleCLIDownload
              #     rhtas-cosign (1.4+: developers.redhat.com). On OCP 4.22 with 1.5.1 that
              #     link did not serve the archive to an anonymous request, so the result
              #     is checked for the gzip magic bytes before it is unpacked
              #  3. the upstream sigstore release on GitHub (cosign is the sigstore
              #     project RHTAS ships), verified against the release's checksum file
              # Only the key pair is made with it; signing stays with Tekton Chains.
              # The loop also re-checks Vault, so keys put there by hand unblock it.
              case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
              is_gzip() { [ "$(head -c2 "$1" | od -An -tx1 | tr -d ' \n')" = "1f8b" ]; }
              keys_exist() {
                [ -n "$(oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv get -field=value kv/secrets/rhtas/cosign-public-key 2>/dev/null)" ]
              }
              get_cosign() {
                rm -rf /tmp/cosign-dl /tmp/cosign && mkdir -p /tmp/cosign-dl
                if curl -sf "http://cli-server.{{ .Values.namespace }}.svc:8080/clients/linux/cosign-${ARCH}.gz" -o /tmp/cosign-dl/cosign.gz \
                   && is_gzip /tmp/cosign-dl/cosign.gz; then
                  echo "cosign from the in-cluster cli-server"
                  gunzip -c /tmp/cosign-dl/cosign.gz > /tmp/cosign && return 0
                fi
                URL=$(oc get consoleclidownload rhtas-cosign -o jsonpath='{range .spec.links[*]}{.href}{"\n"}{end}' 2>/dev/null \
                      | grep -i linux | grep -i "$ARCH" | head -1)
                if [ -n "$URL" ] && curl -sfL "$URL" -o /tmp/cosign-dl/rh.tar.gz && is_gzip /tmp/cosign-dl/rh.tar.gz \
                   && tar -xzf /tmp/cosign-dl/rh.tar.gz -C /tmp/cosign-dl; then
                  BIN=$(find /tmp/cosign-dl -type f -name 'cosign*' ! -name '*.gz' | head -1)
                  if [ -n "$BIN" ]; then echo "cosign from $URL"; mv "$BIN" /tmp/cosign; return 0; fi
                fi
                [ -n "$URL" ] && echo "No cosign archive from $URL (not gzip or not reachable without a login)"
                GH=https://github.com/sigstore/cosign/releases/latest/download
                if curl -sfL "$GH/cosign-linux-${ARCH}" -o /tmp/cosign-dl/cosign-linux-${ARCH} \
                   && curl -sfL "$GH/cosign_checksums.txt" -o /tmp/cosign-dl/cosign_checksums.txt \
                   && (cd /tmp/cosign-dl && grep " cosign-linux-${ARCH}\$" cosign_checksums.txt | sha256sum -c -); then
                  echo "cosign from the upstream sigstore release (checksum verified)"
                  mv /tmp/cosign-dl/cosign-linux-${ARCH} /tmp/cosign && return 0
                fi
                return 1
              }
              until get_cosign && [ -s /tmp/cosign ]; do
                if keys_exist; then
                  echo "Cosign keys appeared in Vault meanwhile, skipping"
                  exit 0
                fi
                echo "No cosign binary yet (cli-server, ConsoleCLIDownload rhtas-cosign, GitHub), retrying in 20s..."
                sleep 20
              done
              chmod +x /tmp/cosign
              /tmp/cosign version 2>/dev/null | grep -i gitversion || true

              # Generate key pair
              echo "Generating cosign key pair..."
              cd /tmp
              COSIGN_PASSWORD="" /tmp/cosign generate-key-pair

              PRIVATE_KEY=$(cat /tmp/cosign.key)
              PUBLIC_KEY=$(cat /tmp/cosign.pub)

              if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
                echo "ERROR: Failed to generate cosign key pair"
                exit 1
              fi

              # Store keys in Vault
              echo "Storing cosign keys in Vault..."
              oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv put kv/secrets/rhtas/cosign-private-key value="$PRIVATE_KEY"
              oc exec vault-0 -n "$VAULT_NAMESPACE" -- vault kv put kv/secrets/rhtas/cosign-public-key value="$PUBLIC_KEY"

              echo "Cosign keys generated and stored in Vault successfully"
