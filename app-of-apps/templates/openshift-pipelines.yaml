apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.openshiftPipelines.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.openshiftPipelines.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: openshift-pipelines
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        subscription:
          source: {{ include "app-of-apps.operatorSource" . }}
          installPlanApproval: {{ include "app-of-apps.installPlanApproval" . }}
          {{- include "app-of-apps.pin" (dict "root" $ "package" "openshift-pipelines-operator-rh") | trim | nindent 10 }}
        rhtas:
          namespace: {{ .Values.rhtas.namespace }}
  syncPolicy:
    automated: {}
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
