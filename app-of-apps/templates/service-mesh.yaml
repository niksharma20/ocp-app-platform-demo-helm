apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.serviceMesh.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.serviceMesh.namespace }}
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - group: sailoperator.io
      kind: ZTunnel
      jsonPointers:
        - /spec/profile
  source:
    path: service-mesh
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        serviceMesh:
          source: {{ include "app-of-apps.operatorSource" . }}
          installPlanApproval: {{ include "app-of-apps.installPlanApproval" . }}
          {{- include "app-of-apps.pin" (dict "root" $ "package" "servicemeshoperator3") | trim | nindent 10 }}
        kiali:
          source: {{ include "app-of-apps.operatorSource" . }}
          installPlanApproval: {{ include "app-of-apps.installPlanApproval" . }}
          {{- include "app-of-apps.pin" (dict "root" $ "package" "kiali-ossm") | trim | nindent 10 }}
        {{- with ($.Values.operators | default dict).istioVersion }}
        istio:
          version: {{ . }}
        {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m0s
      limit: 30
