apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.rhtas.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  destination:
    namespace: {{ .Values.rhtas.namespace }}
    server: https://kubernetes.default.svc
  project: default
  # Trusted Artifact Signer 1.5 no longer has spec.rekor.rekorSearchUI: the API
  # server prunes it, so the Securesign stayed OutOfSync forever (OCP 4.22,
  # operator 1.5.1). Older operators still read the field from the chart.
  ignoreDifferences:
    - group: rhtas.redhat.com
      kind: Securesign
      jsonPointers:
        - /spec/rekor/rekorSearchUI
  source:
    path: rhtas
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        rhtas-operator:
          subscription:
            source: {{ include "app-of-apps.operatorSource" . }}
            installPlanApproval: {{ include "app-of-apps.installPlanApproval" . }}
            {{- include "app-of-apps.pin" (dict "root" $ "package" "rhtas-operator") | trim | nindent 12 }}
        trusted-artifact-signer:
          oidc: {{ .Values.rhtas.oidcIssuer }}
          email: {{ .Values.rhtas.rootCert.email }}
          org: {{ .Values.rhtas.rootCert.org }}
          instance: {{ .Values.rhtas.instance }}
          namespace: {{ .Values.rhtas.namespace }}
          vault:
            namespace: {{ .Values.vault.namespace }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
