apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.kubernetesImagepuller.name "namespace" .Values.argocd.namespace "syncWave" "-1") }}
spec:
  destination:
    namespace: {{ .Values.kubernetesImagepuller.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kubernetes-imagepuller
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        subscription:
          installPlanApproval: {{ include "app-of-apps.installPlanApproval" . }}
          {{- include "app-of-apps.pin" (dict "root" $ "package" "kubernetes-imagepuller-operator") | trim | nindent 10 }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
